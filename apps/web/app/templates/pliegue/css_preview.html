<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muestras CSS de Pliegue</title>
<style>
  body { margin: 0; padding: 16px; font: 14px system-ui, sans-serif; color: #17362c; background: #f2f7f5; }
  article { margin-block: 12px; padding: 12px; border: 1px solid #d4e4dd; border-radius: 10px; background: white; }
  code { display: block; overflow-wrap: anywhere; }
  .sample { margin-block-start: 8px; padding: 8px; border: 1px solid #a1bcb0; overflow: hidden; }
</style>
<body>
  <p>Muestras de declaraciones añadidas sobre contenido de ejemplo. La página real puede verse diferente por sus selectores y estilos existentes.</p>
  {% for sample in samples %}
  <article>
    <code>{{ sample.file }}</code>
    <code>{{ sample.property }}: {{ sample.value }}</code>
    <div class="sample" style="{{ sample.property }}: {{ sample.value }}">Orvia · Panel general</div>
  </article>
  {% endfor %}
</body>
</html>
