<div class="pliegue-visual-tools" data-visual-tools {% if main_tools|default(false) %}data-visual-main{% else %}hidden{% endif %}>
  <button type="button" data-visual-toggle aria-pressed="false" {% if main_tools|default(false) %}disabled{% endif %}>
    <span class="pliegue-visual-cursor" aria-hidden="true"></span> <span data-visual-toggle-label>Seleccionar elemento</span>
  </button>
  <span data-visual-mode hidden>
    <button type="button" data-visual-single aria-pressed="true">Selección simple</button>
    <button type="button" data-visual-add aria-pressed="false">Selección múltiple</button>
  </span>
  <span data-visual-count aria-live="polite"></span>
</div>
