{% extends "base.html" %}
{% import "componentes.html" as componentes %}
{% block titulo %}Iniciar sesion{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width:420px;margin:60px auto;">
  <h1>Plataforma de devoluciones</h1>
  <p class="sub">Inicia sesion para continuar.</p>
  <form method="post" class="formulario">
    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required autocomplete="username">
    {{ componentes.campo_password("password", "password", "Contrasena") }}

    <div class="acciones">
      <button class="boton" type="submit">Iniciar sesion</button>
    </div>
  </form>
</div>

{% endblock %}
