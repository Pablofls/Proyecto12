# Plataforma de devoluciones -- entorno de la VM de GCP.
# Todas las piezas viven UNICAMENTE en la maquina virtual. Nadie levanta este
# compose en su laptop: desde casa se escribe codigo y se sube por git.

services:
  postgres:
    image: postgres:16-alpine
    container_name: devoluciones_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo accesible desde la propia VM, no desde internet.
      # Se usa el 55432 porque la VM ya tiene un PostgreSQL nativo escuchando
      # en el 5432. La aplicacion no usa este mapeo: se conecta por la red
      # interna de Docker al nombre "postgres". Este puerto es solo para
      # conectarte con un cliente desde la propia VM.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devoluciones_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    # Segundo parcial: detalle de inspecciones, metadatos de evidencias, eventos
    # entre servicios y resultados del analisis de causa raiz (seccion 5.4,
    # RNF-06). El enlace con PostgreSQL es inspecciones_ref.mongo_doc_id.
    image: mongo:7
    container_name: devoluciones_mongo
    restart: unless-stopped
    environment:
      # Usuario administrador del motor. Solo se usa para crear la base y el
      # usuario de la aplicacion la primera vez; los servicios no lo usan.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
      # Los lee db/mongo/init.js para crear el usuario de la aplicacion.
      MONGO_DB: ${MONGO_DB}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
      # Los scripts de esta carpeta solo se ejecutan cuando el volumen esta
      # vacio, es decir, la primera vez que se levanta el contenedor.
      - ./db/mongo:/docker-entrypoint-initdb.d:ro,z
    ports:
      # Mismo criterio que Postgres y Redis: solo accesible desde la propia VM.
      - "127.0.0.1:57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: devoluciones_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:${APP_PORT:-8000}:8000"
    volumes:
      # La etiqueta :z reetiqueta el directorio para SELinux, que en CentOS
      # esta en modo Enforcing y de otro modo impide al contenedor leer el
      # codigo montado.
      - ./:/srv/app:z

  # ------------------------------------------------------------------------ #
  # Microservicios (segundo parcial). Se construyen desde la raiz para poder
  # copiar shared/. Exponen el puerto 8000 interno en 8001, 8002, ...
  # ------------------------------------------------------------------------ #
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: devoluciones_auth
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  devoluciones:
    # Registro y resolucion de devoluciones (RF-07, RF-10). Usa las tres bases:
    # PostgreSQL (expediente), MongoDB (eventos) y Redis (sesion JWT, limites).
    build:
      context: .
      dockerfile: services/devoluciones/Dockerfile
    container_name: devoluciones_devoluciones
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "0.0.0.0:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  mongo_data:
