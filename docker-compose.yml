# Plataforma de devoluciones -- entorno de la VM de GCP.
# Las tres piezas viven UNICAMENTE en la maquina virtual. Nadie levanta este
# compose en su laptop: desde casa se escribe codigo y se sube por git.

services:
  postgres:
    image: postgres:16-alpine
    container_name: devoluciones_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo accesible desde la propia VM, no desde internet.
      # Se usa el 55432 porque la VM ya tiene un PostgreSQL nativo escuchando
      # en el 5432. La aplicacion no usa este mapeo: se conecta por la red
      # interna de Docker al nombre "postgres". Este puerto es solo para
      # conectarte con un cliente desde la propia VM.
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devoluciones_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: devoluciones_app
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:${APP_PORT:-8000}:8000"
    volumes:
      # La etiqueta :z reetiqueta el directorio para SELinux, que en CentOS
      # esta en modo Enforcing y de otro modo impide al contenedor leer el
      # codigo montado.
      - ./:/srv/app:z

volumes:
  postgres_data:
  redis_data:
