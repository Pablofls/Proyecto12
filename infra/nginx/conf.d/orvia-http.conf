server {
    listen 8080 default_server;
    server_name _;
    limit_req zone=general burst=120 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Correlation-ID $correlation_id always;

    location = /proxy-health {
        access_log off;
        default_type application/json;
        return 200 '{"servicio":"orvia-proxy","estado":"ok"}';
    }

    # El inicio de sesion recibe un limite adicional al aplicado por Redis.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        set $destino auth; proxy_pass http://$destino:8000;
    }

    # API publica: se conserva la URI completa que esperan los contratos.
    location ^~ /api/v1/auth { include /etc/nginx/snippets/proxy-common.conf; set $destino auth; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/devoluciones { include /etc/nginx/snippets/proxy-common.conf; set $destino devoluciones; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/logistica { include /etc/nginx/snippets/proxy-common.conf; set $destino logistica; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/inspecciones { include /etc/nginx/snippets/proxy-common.conf; set $destino inspecciones; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/disposicion-inventario { include /etc/nginx/snippets/proxy-common.conf; set $destino disposicion-inventario; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/reembolsos-costos { include /etc/nginx/snippets/proxy-common.conf; set $destino reembolsos-costos; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/ventas { include /etc/nginx/snippets/proxy-common.conf; set $destino ventas-catalogos; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/catalogos { include /etc/nginx/snippets/proxy-common.conf; set $destino ventas-catalogos; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/trazabilidad { include /etc/nginx/snippets/proxy-common.conf; set $destino ventas-catalogos; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/evidencias { include /etc/nginx/snippets/proxy-common.conf; set $destino evidencias; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/auditoria { include /etc/nginx/snippets/proxy-common.conf; set $destino analisis-auditoria; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/analisis { include /etc/nginx/snippets/proxy-common.conf; set $destino analisis-auditoria; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/reportes { include /etc/nginx/snippets/proxy-common.conf; set $destino reportes-analitica; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/graficas { include /etc/nginx/snippets/proxy-common.conf; set $destino reportes-analitica; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/analitica { include /etc/nginx/snippets/proxy-common.conf; set $destino reportes-analitica; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/causa-raiz { include /etc/nginx/snippets/proxy-common.conf; set $destino causa-raiz; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/sincronizacion { include /etc/nginx/snippets/proxy-common.conf; set $destino sincronizacion; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/proveedores { include /etc/nginx/snippets/proxy-common.conf; set $destino proveedores; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/integraciones { include /etc/nginx/snippets/proxy-common.conf; set $destino integraciones-monitoreo; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/monitoreo { include /etc/nginx/snippets/proxy-common.conf; set $destino integraciones-monitoreo; proxy_pass http://$destino:8000; }
    location ^~ /api/v1/motivos { include /etc/nginx/snippets/proxy-common.conf; set $destino clasificacion-motivos; proxy_pass http://$destino:8000; }

    # Swagger, contratos XSD y health checks sin volver a publicar 16 puertos.
    location ^~ /servicios/auth/ { set $destino auth; rewrite ^/servicios/auth/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/devoluciones/ { set $destino devoluciones; rewrite ^/servicios/devoluciones/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/logistica/ { set $destino logistica; rewrite ^/servicios/logistica/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/inspecciones/ { set $destino inspecciones; rewrite ^/servicios/inspecciones/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/disposicion-inventario/ { set $destino disposicion-inventario; rewrite ^/servicios/disposicion-inventario/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/reembolsos-costos/ { set $destino reembolsos-costos; rewrite ^/servicios/reembolsos-costos/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/ventas-catalogos/ { set $destino ventas-catalogos; rewrite ^/servicios/ventas-catalogos/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/evidencias/ { set $destino evidencias; rewrite ^/servicios/evidencias/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/auditoria/ { set $destino analisis-auditoria; rewrite ^/servicios/auditoria/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/reportes-analitica/ { set $destino reportes-analitica; rewrite ^/servicios/reportes-analitica/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/causa-raiz/ { set $destino causa-raiz; rewrite ^/servicios/causa-raiz/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/sincronizacion/ { set $destino sincronizacion; rewrite ^/servicios/sincronizacion/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/proveedores/ { set $destino proveedores; rewrite ^/servicios/proveedores/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/integraciones-monitoreo/ { set $destino integraciones-monitoreo; rewrite ^/servicios/integraciones-monitoreo/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }
    location ^~ /servicios/clasificacion-motivos/ { set $destino clasificacion-motivos; rewrite ^/servicios/clasificacion-motivos/(.*)$ /$1 break; include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://$destino:8000; }

    # El monolito conserva todas sus rutas HTML como destino por defecto.
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        set $destino app; proxy_pass http://$destino:8000;
    }
}
