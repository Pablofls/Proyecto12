server {
    listen 8080 default_server;
    server_name _;
    limit_req zone=general burst=120 nodelay;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Correlation-ID $correlation_id always;

    location = /proxy-health {
        access_log off;
        default_type application/json;
        return 200 '{"servicio":"orvia-proxy","estado":"ok"}';
    }

    # El inicio de sesion recibe un limite adicional al aplicado por Redis.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://auth:8000;
    }

    # API publica: se conserva la URI completa que esperan los contratos.
    location ^~ /api/v1/auth { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://auth:8000; }
    location ^~ /api/v1/devoluciones { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://devoluciones:8000; }
    location ^~ /api/v1/logistica { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://logistica:8000; }
    location ^~ /api/v1/inspecciones { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://inspecciones:8000; }
    location ^~ /api/v1/reembolsos-costos { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://reembolsos-costos:8000; }
    location ^~ /api/v1/ventas { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://ventas-catalogos:8000; }
    location ^~ /api/v1/catalogos { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://ventas-catalogos:8000; }
    location ^~ /api/v1/trazabilidad { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://ventas-catalogos:8000; }
    location ^~ /api/v1/evidencias { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://evidencias:8000; }
    location ^~ /api/v1/auditoria { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://analisis-auditoria:8000; }
    location ^~ /api/v1/analisis { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://analisis-auditoria:8000; }
    location ^~ /api/v1/reportes { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://reportes-analitica:8000; }
    location ^~ /api/v1/graficas { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://reportes-analitica:8000; }
    location ^~ /api/v1/analitica { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://reportes-analitica:8000; }
    location ^~ /api/v1/causa-raiz { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://causa-raiz:8000; }
    location ^~ /api/v1/sincronizacion { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://sincronizacion:8000; }
    location ^~ /api/v1/proveedores { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://proveedores:8000; }
    location ^~ /api/v1/integraciones { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://integraciones-monitoreo:8000; }
    location ^~ /api/v1/monitoreo { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://integraciones-monitoreo:8000; }
    location ^~ /api/v1/motivos { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://clasificacion-motivos:8000; }

    # Swagger, contratos XSD y health checks sin volver a publicar 16 puertos.
    location ^~ /servicios/auth/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://auth:8000/; }
    location ^~ /servicios/devoluciones/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://devoluciones:8000/; }
    location ^~ /servicios/logistica/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://logistica:8000/; }
    location ^~ /servicios/inspecciones/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://inspecciones:8000/; }
    location ^~ /servicios/reembolsos-costos/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://reembolsos-costos:8000/; }
    location ^~ /servicios/ventas-catalogos/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://ventas-catalogos:8000/; }
    location ^~ /servicios/evidencias/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://evidencias:8000/; }
    location ^~ /servicios/auditoria/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://analisis-auditoria:8000/; }
    location ^~ /servicios/reportes-analitica/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://reportes-analitica:8000/; }
    location ^~ /servicios/causa-raiz/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://causa-raiz:8000/; }
    location ^~ /servicios/sincronizacion/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://sincronizacion:8000/; }
    location ^~ /servicios/proveedores/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://proveedores:8000/; }
    location ^~ /servicios/integraciones-monitoreo/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://integraciones-monitoreo:8000/; }
    location ^~ /servicios/clasificacion-motivos/ { include /etc/nginx/snippets/proxy-common.conf; proxy_pass http://clasificacion-motivos:8000/; }

    # El monolito conserva todas sus rutas HTML como destino por defecto.
    location / {
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_pass http://app:8000;
    }
}
