user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format orvia '$remote_addr - $request_id [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_user_agent" '
                     'upstream=$upstream_addr tiempo=$request_time';
    access_log /var/log/nginx/access.log orvia;
    error_log /var/log/nginx/error.log warn;

    map $http_x_correlation_id $correlation_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_correlation_id;
        default                    $request_id;
    }
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 30m;

    # Resolver de Docker: con `proxy_pass` por variable Nginx vuelve a resolver el
    # nombre del servicio cada 10 s. Sin esto fija la IP al arrancar y, si un
    # contenedor se recrea o reinicia, enruta al contenedor equivocado (404 o
    # respuestas de otro servicio) hasta recargar (RNF-23).
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
