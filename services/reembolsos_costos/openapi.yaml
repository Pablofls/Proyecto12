openapi: 3.0.3
info: {title: Servicio de reembolsos y costos, version: 1.1.0, description: "Reembolso unico con autorizacion critica, lock Redis y restriccion PostgreSQL; costos, valor recuperado e impacto neto."}
servers: [{url: /}]
security: [{bearerAuth: []}]
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}}
  schemas:
    Reembolso: {type: object, required: [devolucion_id, monto, estado], properties: {devolucion_id: {type: integer}, monto: {type: number, minimum: 0}, metodo: {type: string, enum: [transferencia, tarjeta, efectivo, vale]}, estado: {type: string, enum: [aprobado, rechazado]}}}
    Costo: {type: object, required: [devolucion_id, etapa, monto], properties: {devolucion_id: {type: integer}, etapa: {type: string, enum: [recoleccion, transporte, inspeccion, almacenamiento, reparacion, reacondicionamiento, destruccion, reembolso, otros]}, monto: {type: number, minimum: 0}}}
paths:
  /api/v1/reembolsos-costos/reembolsos:
    post: {summary: Resolver reembolso con autorizacion de un uso y exclusion mutua Redis, parameters: [{name: X-Autorizacion-Operacion, in: header, required: false, description: Obligatorio al aprobar, schema: {type: string}}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Reembolso'}}, application/xml: {schema: {$ref: '#/components/schemas/Reembolso'}}}}, responses: {'201': {description: Reembolso creado}, '400': {description: Validacion}, '401': {description: No autenticado}, '403': {description: Rol o autorizacion critica}, '409': {description: Duplicado estado monto o lock}}}
    get: {summary: Listar reembolsos, responses: {'200': {description: Lista}, '401': {description: No autenticado}}}
  /api/v1/reembolsos-costos/costos:
    post: {summary: Registrar costo por etapa, requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Costo'}}, application/xml: {schema: {$ref: '#/components/schemas/Costo'}}}}, responses: {'201': {description: Costo creado}, '400': {description: Validacion}}}
  /api/v1/reembolsos-costos/costos/{devolucion_id}:
    get: {summary: Desglose costo bruto valor recuperado y costo neto, parameters: [{name: devolucion_id, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: Resumen}, '404': {description: No encontrada}}}
  /api/v1/reembolsos-costos/recuperaciones:
    post: {summary: Registrar valor recuperado, responses: {'201': {description: Valor registrado}, '400': {description: Validacion}}}
  /api/v1/reembolsos-costos/comparacion-destinos/{devolucion_id}:
    get: {summary: Comparacion economica de destinos, parameters: [{name: devolucion_id, in: path, required: true, schema: {type: integer}}], responses: {'200': {description: Comparacion}}}
  /health: {get: {security: [], summary: Salud de PostgreSQL y Redis, responses: {'200': {description: OK}, '503': {description: Degradado}}}}
