openapi: 3.0.3
info:
  title: Servicio de auditoria - Plataforma de devoluciones
  version: 1.0.0
  description: 'Auditoria: consulta de la bitacora (solo lectura, solo agrega) y eventos por correlation id. RF-30,
    RN-12, RNF-23. El analisis (clasificar motivo, Pareto, alertas de fraude, sincronizar, resumen) se separo: su
    sucesor es clasificacion-motivos (8010) y reportes-analitica (8018). Sus rutas fueron retiradas y responden 410.
    JSON/XML y JWT.'
servers:
- url: /
paths:
  /health:
    get:
      summary: Estado PostgreSQL MongoDB Redis
      responses:
        '200':
          description: Estado PostgreSQL MongoDB Redis
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': &id001
          description: Parámetros inválidos
        '401': &id002
          description: Token inválido
        '403': &id003
          description: Sin permisos
        '404': &id004
          description: No encontrado
        '409': &id005
          description: Conflicto de negocio
        '415': &id006
          description: Formato no permitido
        '500': &id007
          description: Error interno
        '503': &id008
          description: Dependencia no disponible
  /api/v1/analisis/{ruta}:
    get: &retirada
      summary: RETIRADO - el analisis ya no se ofrece aqui (410)
      description: 'El analisis (clasificar motivo, Pareto, alertas de fraude, sincronizar, resumen y el alias de eventos)
        se separo de la auditoria y su codigo se retiro. Cualquier metodo y cualquier ruta bajo /api/v1/analisis responde
        410 servicio_movido, aun sin token, con los sucesores en detalles: clasificacion-motivos (8010) POST /api/v1/motivos/sugerencias,
        reportes-analitica (8018) GET /api/v1/analitica/alertas-fraude y GET /api/v1/reportes/pareto, y esta misma API
        GET /api/v1/auditoria/eventos. Lleva Deprecation: true.'
      parameters:
      - name: ruta
        in: path
        required: true
        schema:
          type: string
      responses:
        '410':
          description: servicio_movido, con los sucesores
    post: *retirada
    put: *retirada
    patch: *retirada
    delete: *retirada
  /api/v1/auditoria:
    get:
      summary: Consulta de la bitacora transaccional (solo lectura; solo agrega, no se modifica)
      responses:
        '200':
          description: Consulta bitácora transaccional PostgreSQL
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400': *id001
        '401': *id002
        '403': *id003
        '404': *id004
        '409': *id005
        '415': *id006
        '500': *id007
        '503': *id008
      parameters:
      - name: accion
        in: query
        required: false
        schema:
          type: string
      - name: entidad
        in: query
        required: false
        schema:
          type: string
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
      - name: entidad_id
        in: query
        description: Id del registro afectado
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: usuario_id
        in: query
        description: Id de quien hizo la operacion
        schema:
          type: string
          pattern: ^[0-9]+$
      - name: desde
        in: query
        description: Desde este dia (AAAA-MM-DD)
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        description: Hasta este dia incluido (AAAA-MM-DD)
        schema:
          type: string
          format: date
      security:
      - bearerAuth: []
  /api/v1/auditoria/eventos:
    get:
      summary: Eventos publicados por los servicios, por correlation id o servicio (sin el campo datos)
      responses:
        '200':
          description: Consulta eventos de auditoría MongoDB
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400':
          description: Parámetros inválidos
        '401':
          description: Token inválido
        '403':
          description: Sin permisos
        '404':
          description: No encontrado
        '409':
          description: Conflicto de negocio
        '415':
          description: Formato no permitido
        '500':
          description: Error interno
        '503':
          description: Dependencia no disponible
      parameters:
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
      - name: servicio
        in: query
        required: false
        schema:
          type: string
      security:
      - bearerAuth: []
      description: RNF-23. Ruta de auditoria; /api/v1/analisis/eventos es un alias obsoleto de esta.
  /api/v1/auditoria/estado:
    get:
      summary: Resumen de la bitacora y estado de su proteccion contra modificaciones
      responses:
        '200':
          description: Consulta eventos de auditoría MongoDB
          content:
            application/json:
              schema:
                type: object
            application/xml:
              schema:
                type: object
        '400':
          description: Parámetros inválidos
        '401':
          description: Token inválido
        '403':
          description: Sin permisos
        '404':
          description: No encontrado
        '409':
          description: Conflicto de negocio
        '415':
          description: Formato no permitido
        '500':
          description: Error interno
        '503':
          description: Dependencia no disponible
      security:
      - bearerAuth: []
      description: 'Registros, primera y ultima fecha, y si la base bloquea UPDATE, DELETE y TRUNCATE (migracion
        045). La proteccion es del esquema: frena a la aplicacion o a una inyeccion, no a quien administre PostgreSQL.'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
