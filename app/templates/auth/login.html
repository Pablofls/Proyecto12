{% extends "base.html" %}
{% block titulo %}Iniciar sesion{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width:420px;margin:60px auto;">
  <h1>Plataforma de devoluciones</h1>
  <p class="sub">Inicia sesion para continuar.</p>
  <form method="post" class="formulario">
    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required autocomplete="username">
    <label for="password">Contrasena</label>
    <div class="campo-password">
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="button" class="ver-password" id="ver_password"
              aria-label="Mostrar contrasena" aria-pressed="false" title="Mostrar contrasena">
        <svg class="icono-ojo" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg class="icono-ojo-tachado" viewBox="0 0 24 24" width="18" height="18" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="oculto">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
          <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
    </div>
    <div class="acciones">
      <button class="boton" type="submit">Iniciar sesion</button>
    </div>
  </form>
</div>

<script>
  // Alterna entre ocultar y mostrar la contrasena. El boton es type="button"
  // para que no envie el formulario al pulsarlo.
  (function () {
    const campo = document.getElementById('password');
    const boton = document.getElementById('ver_password');
    const ojo = boton.querySelector('.icono-ojo');
    const ojoTachado = boton.querySelector('.icono-ojo-tachado');

    boton.addEventListener('click', function () {
      const visible = campo.type === 'text';
      campo.type = visible ? 'password' : 'text';
      // Se usa una clase y no el atributo hidden: ese atributo no oculta
      // elementos SVG, porque la regla del navegador que lo aplica solo
      // alcanza a los elementos HTML.
      ojo.classList.toggle('oculto', !visible);
      ojoTachado.classList.toggle('oculto', visible);
      const etiqueta = visible ? 'Mostrar contrasena' : 'Ocultar contrasena';
      boton.setAttribute('aria-label', etiqueta);
      boton.setAttribute('title', etiqueta);
      boton.setAttribute('aria-pressed', String(!visible));
      campo.focus();
    });
  })();
</script>
{% endblock %}
